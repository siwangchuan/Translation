version: '3.8'

services:
  backend:
    build: .
    container_name: translation-backend
    ports:
      - "8000:8000"
    environment:
      - ALIYUN_API_KEY=${ALIYUN_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
